<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101116">
  <title>GOD'S PLAN AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101116;
      color: #f5f5f5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      border-bottom: 1px solid #292a33;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    header p {
      color: #aaa;
      margin: 7px 0 0;
      font-size: 13px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome {
      text-align: center;
      margin: auto 0;
      color: #bbb;
      line-height: 1.7;
    }

    .welcome h2 {
      color: white;
    }

    .message {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      background: #343642;
    }

    .assistant {
      align-self: flex-start;
      background: #1c1d25;
    }

    .message img {
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
      display: block;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    #preview {
      display: none;
      padding: 8px 14px;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #292a33;
    }

    #preview img {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
    }

    button {
      border: none;
      cursor: pointer;
      color: white;
      font-size: 19px;
    }

    #removePhoto {
      background: #353640;
      border-radius: 50%;
      width: 32px;
      height: 32px;
    }

    #composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: #101116;
      border-top: 1px solid #292a33;
    }

    #attachButton,
    #sendButton {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #292a35;
    }

    #sendButton {
      background: #7255e8;
    }

    #question {
      flex: 1;
      min-width: 0;
      resize: none;
      max-height: 120px;
      padding: 13px;
      border-radius: 22px;
      border: 1px solid #393a46;
      outline: none;
      background: #20212a;
      color: white;
      font: inherit;
    }

    #question::placeholder {
      color: #aaa;
    }

    #fileInput {
      display: none;
    }

    #photoMenu {
      display: none;
      position: absolute;
      bottom: 76px;
      left: 12px;
      padding: 8px;
      background: #252630;
      border: 1px solid #444550;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0008;
    }

    #photoMenu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px;
      border-radius: 8px;
      background: transparent;
      font-size: 15px;
    }

    #photoMenu button:hover {
      background: #393a46;
    }

    #status {
      color: #b8b8c4;
      font-size: 13px;
      padding: 0 16px 8px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🙏 GOD'S PLAN AI</h1>
    <p>Your personal AI assistant</p>
  </header>

  <main id="chat" aria-live="polite">
    <div class="welcome" id="welcome">
      <h2>How can I help you today?</h2>
      Ask a question or attach a photo 📸
    </div>
  </main>

  <div id="status"></div>

  <div id="preview">
    <img id="previewImage" alt="Selected photo">
    <span>Photo attached</span>
    <button id="removePhoto" type="button" aria-label="Remove photo">×</button>
  </div>

  <div id="photoMenu">
    <button id="galleryOption" type="button">🖼️ Choose from gallery</button>
    <button id="cameraOption" type="button">📷 Take a photo</button>
  </div>

  <form id="composer">
    <button id="attachButton" type="button" aria-label="Attach photo">＋</button>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
    >

    <textarea
      id="question"
      rows="1"
      placeholder="Ask GOD'S PLAN AI..."
      aria-label="Your message"
    ></textarea>

    <button id="sendButton" type="submit" aria-label="Send message">➤</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("composer");
    const question = document.getElementById("question");
    const fileInput = document.getElementById("fileInput");
    const attachButton = document.getElementById("attachButton");
    const photoMenu = document.getElementById("photoMenu");
    const galleryOption = document.getElementById("galleryOption");
    const cameraOption = document.getElementById("cameraOption");
    const preview = document.getElementById("preview");
    const previewImage = document.getElementById("previewImage");
    const removePhoto = document.getElementById("removePhoto");
    const status = document.getElementById("status");

    let selectedPhoto = null;
    let selectedPhotoURL = null;

    attachButton.addEventListener("click", () => {
      photoMenu.style.display =
        photoMenu.style.display === "block" ? "none" : "block";
    });

    galleryOption.addEventListener("click", () => {
      fileInput.removeAttribute("capture");
      fileInput.click();
      photoMenu.style.display = "none";
    });

    cameraOption.addEventListener("click", () => {
      fileInput.setAttribute("capture", "environment");
      fileInput.click();
      photoMenu.style.display = "none";
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        status.textContent = "Please select an image.";
        return;
      }

      if (file.size > 10 * 1024 * 1024) {
        status.textContent = "Please choose an image smaller than 10 MB.";
        fileInput.value = "";
        return;
      }

      selectedPhoto = file;

      if (selectedPhotoURL) {
        URL.revokeObjectURL(selectedPhotoURL);
      }

      selectedPhotoURL = URL.createObjectURL(file);
      previewImage.src = selectedPhotoURL;
      preview.style.display = "flex";
      status.textContent = "";
    });

    removePhoto.addEventListener("click", () => {
      selectedPhoto = null;
      fileInput.value = "";
      preview.style.display = "none";

      if (selectedPhotoURL) {
        URL.revokeObjectURL(selectedPhotoURL);
        selectedPhotoURL = null;
      }
    });

    question.addEventListener("input", () => {
      question.style.height = "auto";
      question.style.height = Math.min(question.scrollHeight, 120) + "px";
    });

    function addMessage(role, text, photoURL = null) {
      const welcome = document.getElementById("welcome");
      if (welcome) welcome.remove();

      const bubble = document.createElement("div");
      bubble.className = "message " + role;

      if (photoURL) {
        const img = document.createElement("img");
        img.src = photoURL;
        img.alt = "Attached photo";
        bubble.appendChild(img);
      }

      const textNode = document.createElement("div");
      textNode.textContent = text;
      bubble.appendChild(textNode);

      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;

      return textNode;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = question.value.trim();

      if (!text && !selectedPhoto) {
        status.textContent = "Type a question or attach a photo first.";
        return;
      }

      // This is the frontend demonstration stage.
      // The secure Gemini backend will be connected next.
      const photoURL = selectedPhotoURL;

      addMessage("user", text || "Please describe this photo.", photoURL);

      question.value = "";
      question.style.height = "auto";
      status.textContent = "";

      selectedPhoto = null;
      selectedPhotoURL = null;
      fileInput.value = "";
      preview.style.display = "none";
      photoMenu.style.display = "none";

      const reply = addMessage(
        "assistant",
        "The chat interface is ready! Gemini connection is the next step."
      );

      status.textContent = "Frontend demonstration — AI connection not added yet.";
    });

    document.addEventListener("click", (event) => {
      if (
        !photoMenu.contains(event.target) &&
        !attachButton.contains(event.target)
      ) {
        photoMenu.style.display = "none";
      }
    });
  </script>
</body>
  </html>
